name: netrascope
version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: netrascope
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d netrascope"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrations
    environment:
      ConnectionStrings__NetraScope: Host=db;Port=5432;Database=netrascope;Username=postgres;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      Auth__Jwt__Secret: ${JWT_SECRET:?JWT_SECRET must be set in .env to a long random value}
      Auth__Jwt__Issuer: ${JWT_ISSUER:-NetraScope}
      Auth__Jwt__Audience: ${JWT_AUDIENCE:-NetraScope}
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: final
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__NetraScope: Host=db;Port=5432;Database=netrascope;Username=postgres;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      Auth__Jwt__Secret: ${JWT_SECRET:?JWT_SECRET must be set in .env to a long random value}
      Auth__Jwt__Issuer: ${JWT_ISSUER:-NetraScope}
      Auth__Jwt__Audience: ${JWT_AUDIENCE:-NetraScope}
      Auth__Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-60}
      Auth__AllowRegistration: ${AUTH_ALLOW_REGISTRATION:-true}
      Auth__RateLimit__PermitLimit: ${AUTH_RATE_LIMIT_PERMIT_LIMIT:-10}
      Auth__RateLimit__WindowSeconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
      Metrics__RateLimit__PermitLimit: ${METRICS_RATE_LIMIT_PERMIT_LIMIT:-600}
      Metrics__RateLimit__WindowSeconds: ${METRICS_RATE_LIMIT_WINDOW_SECONDS:-60}
      Alerting__Enabled: ${ALERTING_ENABLED:-true}
      Alerting__CpuThresholdPct: ${ALERT_CPU_THRESHOLD_PCT:-90}
      Alerting__CpuSustainedMinutes: ${ALERT_CPU_SUSTAINED_MINUTES:-5}
      Alerting__MemoryThresholdPct: ${ALERT_MEMORY_THRESHOLD_PCT:-90}
      Alerting__DiskThresholdPct: ${ALERT_DISK_THRESHOLD_PCT:-85}
      Alerting__CpuTempThresholdC: ${ALERT_CPU_TEMP_THRESHOLD_C:-85}
      Alerting__OfflineMinutes: ${ALERT_OFFLINE_MINUTES:-2}
      Alerting__WebhookUrls__0: ${ALERT_WEBHOOK_URL:-}
      Alerting__EmailWebhookUrl: ${ALERT_EMAIL_WEBHOOK_URL:-}
      Alerting__DiscordWebhookUrl: ${ALERT_DISCORD_WEBHOOK_URL:-}
      Alerting__SlackWebhookUrl: ${ALERT_SLACK_WEBHOOK_URL:-}
      Alerting__TelegramBotToken: ${ALERT_TELEGRAM_BOT_TOKEN:-}
      Alerting__TelegramChatId: ${ALERT_TELEGRAM_CHAT_ID:-}
      MetricRetention__Enabled: ${METRIC_RETENTION_ENABLED:-true}
      MetricRetention__RawRetentionDays: ${METRIC_RAW_RETENTION_DAYS:-30}
      MetricRetention__FiveMinuteRetentionDays: ${METRIC_FIVE_MINUTE_RETENTION_DAYS:-90}
      MetricRetention__HourRetentionDays: ${METRIC_HOUR_RETENTION_DAYS:-365}
      MetricRetention__IntervalMinutes: ${METRIC_MAINTENANCE_INTERVAL_MINUTES:-5}
      MetricRetention__FiveMinuteLookbackMinutes: ${METRIC_FIVE_MINUTE_LOOKBACK_MINUTES:-90}
      MetricRetention__HourLookbackMinutes: ${METRIC_HOUR_LOOKBACK_MINUTES:-180}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    depends_on:
      - backend

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-8080}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  db-data:
